name: pip-audit

on:
  push:
    branches: [ "Stable" ]
  pull_request:
    branches: [ "Stable" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pip-audit
      run: pip install pip-audit

    - name: Audit dependencies
      run: |
        pip-audit -r security-testing-suite/requirements.txt \
          --progress-spinner off \
          --strict
