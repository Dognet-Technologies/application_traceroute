[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-testing-suite"
version = "4.0.9"
description = "Advanced Security Testing Suite with Causal Inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Simone"}]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.33",
    "lxml>=4.9.0",
    "urllib3>=2.0.0",
    "aiohttp>=3.9.0",
    "networkx>=3.1",
    "rich>=13.0.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
]

[project.scripts]
security-traceroute = "core.traceroute.application_traceroute_v4:main"
security-crawler = "core.crawler.smart_vuln_crawler2:main"

[tool.setuptools.packages.find]
exclude = ["build", "build.*"]
